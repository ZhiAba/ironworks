item.ironworks-bauxite.name = Bauxite
item.ironworks-bauxite.description = Alumina-bearing ore. The start of the aluminum line; also recoverable from scrap.
item.ironworks-alumina.name = Alumina
item.ironworks-alumina.description = White powder, the only feedstock for aluminum electrolysis.
item.ironworks-cryolite.name = Cryolite
item.ironworks-cryolite.description = Flux that drops alumina's melting point from 2050C to 960C.
item.ironworks-red-mud.name = Red Mud
item.ironworks-red-mud.description = Caustic tailings from bauxite digestion; thorium can be recovered from it.
item.ironworks-aluminum-sheet.name = Aluminum Sheet
item.ironworks-aluminum-sheet.description = Rolled aluminum for light structures and machine casings.

