ironworks.rbmk.win.modeSection = Operating mode
ironworks.rbmk.win.mode.autoHint = Auto: set target power; rods are solved from fuel temperature, water, steam, xenon, void and the rod-tip curve.
ironworks.rbmk.win.mode.semiHint = Semi-auto: the operator sets a common rod target; protection only pushes rods in, then releases back to the operator target.
ironworks.rbmk.win.mode.manualHint = Manual: rods respond instantly; per-zone rods and throttle; no automatic protection.
