block.ironworks-alloy-furnace.name = Alloy Furnace
block.ironworks-alloy-furnace.description = Copper-lead-titanium-silicon alloy, two at a time for 12 power.
block.ironworks-pyro-works.name = Pyro Works
block.ironworks-pyro-works.description = Pyratite and blast compound, sharing sulfur and coal with the ammo line.
block.ironworks-scrap-works.name = Scrap Works
block.ironworks-scrap-works.description = Sorts scrap back into copper, lead, titanium and thorium; red mud is leached here too.

