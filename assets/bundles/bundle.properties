item.ironworks-iron-plate.name = Iron Plate
item.ironworks-iron-plate.description = Rolled iron plate. Basic structural part for shell assembly and heavy machinery.
item.ironworks-he-shell.name = HE Shell
item.ironworks-he-shell.description = Large-calibre high-explosive shell. Wide splash, good against groups.
item.ironworks-ap-shell.name = AP Shell
item.ironworks-ap-shell.description = Large-calibre armour-piercing shell. High direct damage, pierces multiple targets.
item.ironworks-incendiary-shell.name = Incendiary Shell
item.ironworks-incendiary-shell.description = Thickened oil shell. Ignites the ground and burns targets.
item.ironworks-frag-shell.name = Frag Shell
item.ironworks-frag-shell.description = Airbursts into shrapnel, covering a wide area.
block.ironworks-shell-assembly.name = Shell Assembly
block.ironworks-shell-assembly.description = Produces the four large-calibre shells used by the mortar. Switch recipes to change shell type.
block.ironworks-mortar.name = Mortar
block.ironworks-mortar.description = 70-tile siege mortar that automatically aims at the densest enemy cluster in range, with a huge splash radius; the inner 20 tiles are a blind spot (red ring when selected). Only accepts large-calibre shells.
