ironworks.rbmk.win.zoneTip = Each zone has two temperature lines: fuel temperature drives Doppler feedback and melt, coolant temperature drives evaporation. Hot coolant with cool fuel means poor heat transfer or low water; add feedwater before inserting rods.
ironworks.rbmk.win.notes = Decay heat remains after shutdown, so do not remove the pumps immediately. Fuel above 200% accumulates per-zone melt damage; evaporation speeds up above 50% coolant, up to 1.6x. The 0–20% rod-tip range can raise power before it lowers it.
