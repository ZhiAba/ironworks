item.ironworks-steel-ingot.description = Decarburized in the converter. An intermediate before rolling.
block.ironworks-rolling-mill.name = Rolling Mill
block.ironworks-rolling-mill.description = Rolling: copper, lead, titanium and steel plates share one set of rolls.
