item.ironworks-reactive-plate.name = Reactive Armor Plate
item.ironworks-reactive-plate.description = External armor. Explosive reactive layers stop kinetic rounds. Best protection, worst mobility.
item.ironworks-composite-plate.name = Composite Armor Plate
item.ironworks-composite-plate.description = External armor. Ceramic-metal sandwich. A balance of protection and mobility.
item.ironworks-nanite-plate.name = Nanite Armor Plate
item.ironworks-nanite-plate.description = External armor. Carries nanite swarms that repair the host and boost its performance.
block.ironworks-armor-press.name = Armor Press
block.ironworks-armor-press.description = Presses steel and titanium plates into external armor. Three armors, three tradeoffs.
block.ironworks-armor-dock.name = Armor Dock
block.ironworks-armor-dock.description = Installs armor plates onto nearby allied units, one plate each. Armor never falls off; a unit can only wear one.
recipe.ironworks.reactive-plate = Reactive Armor Plate
