item.ironworks-corrosive-ammo.name = Corrosive Shell
item.ironworks-corrosive-ammo.description = Filled with sulfur compounds. Mediocre direct damage, but it dissolves armor and slows the target.
block.ironworks-nano-field.name = Nano Repair Field
block.ironworks-nano-field.description = Releases nanite swarms over nearby allied units, repairing their armor and slightly boosting performance.
block.ironworks-jade-beacon.name = Jade Beacon
block.ironworks-jade-beacon.description = Installs a self-destruct protocol on nearby allies: units detonate on death, damaging nearby enemies.
block.ironworks-critical-device.name = Critical Device
block.ironworks-critical-device.description = Only affects wounded units. Removes the limiter in exchange for more damage and mobility.
