item.ironworks-steel-plate.name = Steel Plate
item.ironworks-steel-plate.description = Steel, decarburized in an oxygen converter.

liquid.ironworks-oxygen.name = Oxygen
liquid.ironworks-oxygen.description = Byproduct of water electrolysis. Used for steelmaking.

block.ironworks-separator.name = Magnetic Separator
block.ironworks-separator.description = Physically separates iron sand with magnets. No reagents needed.
block.ironworks-electrolysis-plant.name = Electrolysis Plant
block.ironworks-electrolysis-plant.description = One set of cells: split water for hydrogen and oxygen, or switch the electrolyte to refine metals. Hydrogen exits right, oxygen exits left (arrow markers).
block.ironworks-reducer.name = Hydrogen Reducer
block.ironworks-reducer.description = Fe2O3 + 3H2 -> 2Fe + 3H2O. Reduces ore with hydrogen, releasing water.
block.ironworks-converter.name = Oxygen Converter
block.ironworks-converter.description = Blows oxygen into molten iron. The melt carries its own heat and carbon oxidation adds more, so no external heat source is needed. Feed molten iron and oxygen from adjacent blocks; molten steel comes out to adjacent blocks.
block.ironworks-steel-wall.name = Steel Wall
block.ironworks-steel-wall.description = A wall of rolled steel plates. Tough and cheap to repair.

techtree.ironworks = Ironworks
