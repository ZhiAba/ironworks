block.ironworks-piercer.description = Long range armour piercer. Slow but punches through. Accepts water or cryogenic liquid as coolant for sustained fire.
block.ironworks-blast-furnace.name = Blast Furnace
block.ironworks-blast-furnace.description = Reduces ore with coke and taps molten iron. Heat comes from burning coke. Molten iron flows to adjacent blocks; put a converter or caster next to it.
