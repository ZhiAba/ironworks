recipe.ironworks.molten-steel-barrel = Molten Steel Barrel

block.ironworks-hot-router.name = Hot Router
block.ironworks-hot-router.description = Liquid router for molten metals.
block.ironworks-hot-junction.name = Hot Junction
block.ironworks-hot-junction.description = Crosses two molten-metal lines without mixing.
block.ironworks-hot-bridge.name = Hot Bridge
block.ironworks-hot-bridge.description = Carries molten metal over obstacles.

block.ironworks-coolant-conduit.name = Coolant Loop Pipe
block.ironworks-coolant-conduit.description = Leak-free pipe for closed coolant loops. Ordinary conduits leak coolant onto the ground at open ends, which looks like the liquid evaporating.

block.ironworks-liquid-conveyor.name = Coolant Belt
block.ironworks-liquid-conveyor.description = A conveyor with a liquid groove. Carries a small amount slowly (capacity 9), leaks at open ends, and speeds up items while wet. When destroyed, the liquid quenches fire.

block.ironworks-liquid-monitor.name = Liquid Monitor (Debug)
block.ironworks-liquid-monitor.description = Every second writes exact cold/hot coolant totals and a per-block breakdown to /sdcard/ironworks-liquid.log. Debug only.

block.ironworks-liquid-belt-router.name = Coolant Belt Router
block.ironworks-liquid-belt-router.description = Splits items in four directions and dumps belt liquid to neighbours.
block.ironworks-liquid-belt-bridge.name = Coolant Belt Bridge
block.ironworks-liquid-belt-bridge.description = Item bridge spanning 4 tiles that also carries liquid to the other end.
block.ironworks-liquid-conveyor-adv.name = Reinforced Coolant Belt
block.ironworks-liquid-conveyor-adv.description = Silicon carbide and graphite electrode construction. Faster, capacity 15, quicker liquid steps, 1.5x wet boost.
block.ironworks-liquid-belt-router-adv.name = Reinforced Coolant Router
block.ironworks-liquid-belt-router-adv.description = Heat-resistant belt router with capacity 15 and faster liquid steps.
block.ironworks-liquid-belt-bridge-adv.name = Reinforced Coolant Bridge
block.ironworks-liquid-belt-bridge-adv.description = Spans 6 tiles and moves liquid faster.

block.ironworks-liquid-belt-junction.name = Coolant Belt Junction
block.ironworks-liquid-belt-junction.description = Passes items and liquid straight through to the opposite side; crossing lines do not mix.
block.ironworks-liquid-belt-junction-adv.name = Reinforced Coolant Junction
block.ironworks-liquid-belt-junction-adv.description = Silicon carbide and graphite electrode junction that accepts any coolant.
