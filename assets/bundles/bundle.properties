item.ironworks-graphene.name = Graphene
item.ironworks-graphene.description = Single-layer carbon exfoliated from graphite with hydrogen. Gateway to coolant, advanced electronics and armour.
liquid.ironworks-graphene-coolant.name = Graphene Coolant
liquid.ironworks-graphene-coolant.description = The cold side of the coolant loop. Turns into hot coolant after absorbing heat.
liquid.ironworks-hot-coolant.name = Hot Coolant
liquid.ironworks-hot-coolant.description = The hot side. Send it to a coolant plant to be recooled.
block.ironworks-graphene-forge.name = Graphene Forge
block.ironworks-graphene-forge.description = Exfoliates graphite into graphene under hydrogen. Consumes power and hydrogen.
block.ironworks-fluidizer.name = Graphene Fluidizer
block.ironworks-fluidizer.description = Graphene + water + power -> graphene coolant (cold side).
block.ironworks-coolant-plant.name = Coolant Plant
block.ironworks-coolant-plant.description = Hot coolant + water + power -> cold coolant, 1:1. The other half of the loop.
recipe.ironworks.graphene = Graphene
recipe.ironworks.graphene-coolant = Graphene Coolant
recipe.ironworks.recool = Recool

liquid.ironworks-acid.name = Acid
liquid.ironworks-acid.description = Basic chemical liquid. Used for corrosive ammo and acid-process graphene.
item.ironworks-silicon-carbide.name = Silicon Carbide
item.ironworks-silicon-carbide.description = Heat-resistant ceramic. Lining for hot pipes and graphite crucibles.
item.ironworks-graphite-electrode.name = Graphite Electrode
item.ironworks-graphite-electrode.description = Conductive, heat-resistant part for arc furnaces and hot pipes.
item.ironworks-molten-iron-barrel.name = Molten Iron Barrel
item.ironworks-molten-iron-barrel.description = Heat-resistant barrel of molten iron. Pour it beside a caster or converter.
item.ironworks-molten-steel-barrel.name = Molten Steel Barrel
item.ironworks-molten-steel-barrel.description = Heat-resistant barrel of molten steel.
block.ironworks-acid-plant.name = Acid Plant
block.ironworks-acid-plant.description = Sulfur + water + power -> acid. Source of corrosive ammo and acid-process graphene.
block.ironworks-hot-conduit.name = Hot Conduit
block.ironworks-hot-conduit.description = Graphite pipe with a silicon carbide lining, built for molten metal. Ordinary pipes accept it, but burn through.
block.ironworks-graphite-crucible.name = Graphite Crucible
block.ironworks-graphite-crucible.description = Molten-metal storage tank. 1500 capacity, built for high-temperature liquids.
