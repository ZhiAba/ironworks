liquid.ironworks-sodium-aluminate.description = Bayer digestion product; roasting recovers the acid and leaves alumina.
liquid.ironworks-molten-aluminum.name = Molten Aluminum
liquid.ironworks-molten-aluminum.description = Tapped from the cell at ~960C. Only moves between adjacent blocks.


