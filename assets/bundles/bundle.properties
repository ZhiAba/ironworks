recipe.ironworks.molten-steel = Molten Steel
recipe.ironworks.steel-ingot = Steel Ingot
recipe.ironworks.arc-steel = Arc Furnace Steel

block.ironworks-air-separator.name = Air Separator
block.ironworks-air-separator.description = Cryogenically separates air: nitrogen exits right, oxygen exits left (arrow markers). Serpulo has no nitrogen source of its own, so the black powder line depends on this.

item.ironworks-cast-iron.name = Cast Iron Part
item.ironworks-cast-iron.description = Grey cast iron cast into sand moulds. Used for the frames and bases of heavy machinery.
