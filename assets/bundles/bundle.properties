# ---- RBMK 核电站（0.66.0.0） ----
block.ironworks-rbmk-reactor.name = RBMK Reactor
block.ironworks-rbmk-reactor.description = 5x5 graphite-moderated water-cooled reactor. Turns water into **steam** 1:1 (980 L/s feedwater and 980 L/s steam at 100% flux); the turbine makes power, the reactor makes none. Rods set the flux ceiling; low feedwater triggers the positive void coefficient. If the steam line is blocked and the tank is full, pushing the rods fully in triggers the AZ-5 reactivity spike. Core heat above 125% for one second melts down. Steam only vents from the non-feed sides; the feed side only takes water.
block.ironworks-steam-turbine.name = Steam Turbine
block.ironworks-steam-turbine.description = 3x3 turbine. Turns reactor steam into power; exhaust condenses to warm water and returns via a cooling tower. The reactor makes no power itself. It stops automatically when the warm-water tank is full and resumes when drained.
