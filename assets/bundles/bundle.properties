# ---- RBMK 核电站（0.66.0.0） ----
block.ironworks-rbmk-reactor.name = RBMK Reactor
block.ironworks-rbmk-reactor.description = 5x5 graphite-moderated boiling water reactor. Water boils directly in the core; the steam drives a turbine, so the reactor itself produces no power. At 100% power it uses 980 L/s feedwater and makes 980 L/s steam. Deeper rods mean lower power; low feedwater triggers the positive void coefficient. If the steam line is blocked, the tank is full, and the rods are fully inserted, the AZ-5 reactivity spike can blow the core. Core heat at 125% for one second causes meltdown. Steam only exits from the non-feed sides.
block.ironworks-rbmk-reactor-9.name = RBMK-9 Zoned Reactor
block.ironworks-rbmk-reactor-9.description = 12x12 zoned graphite-moderated boiling water reactor. The core is a 3x3 grid of 4x4 zones; each zone tracks its own power, fuel temperature, coolant temperature, water/steam inventory, and control rod. The whole reactor shares feedwater and steam headers. Rated throughput is 3240 L/s (360 L/s per zone), with a 32400 L water tank and 6480 L steam drum. Fuel temperature above 200% accumulates melt damage per zone; any zone reaching 100% damage destroys the whole reactor. Graphite rod tips, Doppler feedback, decay heat, and the positive void coefficient are all active.
block.ironworks-steam-turbine.name = Steam Turbine
block.ironworks-steam-turbine.description = 3x3 turbine. Uses 122.5 steam/s, makes 24000 power/s, and condenses exhaust 1:1 into 122.5 warm water/s. It stops when the warm-water tank is full and resumes when drained. The reactor itself makes no power.
block.ironworks-steam-turbine-4.name = Large Steam Turbine
block.ironworks-steam-turbine-4.description = 4x4 turbine, one per 4x4 reactor zone. Consumes 360 steam/s, produces 72000 power/s, and condenses 1:1 into 360 warm water/s. Stops when the warm-water tank is full and resumes after draining.
