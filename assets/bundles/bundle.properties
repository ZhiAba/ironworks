recipe.ironworks.nanite-plate = Nanite Armor Plate

liquid.ironworks-molten-iron.name = Molten Iron
liquid.ironworks-molten-iron.description = Molten pig iron tapped from the blast furnace at about 1400 C. Can only be moved to adjacent blocks.
liquid.ironworks-molten-steel.name = Molten Steel
liquid.ironworks-molten-steel.description = Steel tapped from the converter or arc furnace, ready for continuous casting.
block.ironworks-caster.name = Continuous Caster
block.ironworks-caster.description = Three-way caster: molten steel into steel ingots, molten iron into pig iron ingots, or molten iron plus sand moulds into cast iron parts. Liquids come from adjacent blocks.
block.ironworks-arc-furnace.name = Arc Furnace
block.ironworks-arc-furnace.description = Remelts sponge iron into steel with graphite electrodes. This is where electricity finally belongs.
