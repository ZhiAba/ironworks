block.ironworks-verbose-logger.name = Verbose Logger (Debug)
block.ironworks-verbose-logger.description = Every tick scans the world: player position/health, unit and building counts, mod turret ammo/coolant/targets, coolant totals with deltas, and tap/build/destroy/config/deposit events. Writes /sdcard/ironworks-tick.log (falls back to the game data dir), capped at 24 MB.

item.ironworks-silver.name = Silver
item.ironworks-silver.description = Precious metal leached from scrap. Required for advanced chips.
item.ironworks-gold.name = Gold
item.ironworks-gold.description = Rarer precious metal, also from acid leaching. Contact material for advanced processors.
item.ironworks-titanium-alloy.name = Titanium Alloy
item.ironworks-titanium-alloy.description = Titanium and steel alloy. Structural material for quantum cores.
item.ironworks-basic-chip.name = Basic Chip
item.ironworks-basic-chip.description = Silicon, copper plate and acid etching. The first chip-tier material.
item.ironworks-advanced-chip.name = Advanced Processor
item.ironworks-advanced-chip.description = Basic chip, silver, gold and plastanium packaging. Core of high-tier turrets.
item.ironworks-quantum-core.name = Quantum Core
item.ironworks-quantum-core.description = Advanced chip, graphene and titanium alloy with massive power draw. Endgame construction material.
block.ironworks-precious-leach.name = Precious Leach Plant
block.ironworks-precious-leach.description = Acid-leaches silver and gold from scrap. Switch recipes to choose output.
block.ironworks-chip-fab.name = Chip Fabricator
block.ironworks-chip-fab.description = Three-tier chip line: basic chip -> advanced processor -> quantum core.
block.ironworks-arc-tower.name = Arc Tower
block.ironworks-arc-tower.description = Power-hungry chain lightning turret that overloads mechanical units.
