block.ironworks-rail-tower.name = Rail Lance
block.ironworks-rail-tower.description = Electromagnetic siege cannon unlocked by advanced processors. Three-second charge, pierces up to 5 targets with a brilliant rail beam.
block.ironworks-singularity-tower.name = Singularity Launcher
block.ironworks-singularity-tower.description = Unlocked by quantum cores. Fires a slow singularity that drags in enemies within 10 tiles and collapses after 5 seconds in a large explosion.

item.ironworks-aluminum.name = Aluminum
item.ironworks-aluminum.description = Light metal reduced from sand and coal with power.
item.ironworks-aluminum-alloy.name = Aluminum Alloy
item.ironworks-aluminum-alloy.description = Aluminum-copper alloy: light and tough.
item.ironworks-aviation-aluminum.name = Aviation Aluminum
item.ironworks-aviation-aluminum.description = Alloy, titanium and graphene. Top-tier lightweight structural material.
