block.ironworks-rapid-cannon.description = 射速高、伤害足，但射程短。使用铜制弹药或重头弹。可接水（或低温液体）冷却，提高持续射速。
block.ironworks-piercer.name = 穿甲炮
block.ironworks-piercer.description = 射程远、穿透强，但射速很慢。可接水（或低温液体）冷却，提高持续射速。
block.ironworks-blast-furnace.name = 高炉
block.ironworks-blast-furnace.description = 焦炭还原铁精矿，放出铁水。热量来自焦炭燃烧。铁水从相邻方块输出，记得旁边接转炉或连铸机。
recipe.ironworks.iron-ingot = 生铁
item.ironworks-titanium-plate.name = 钛板
item.ironworks-titanium-plate.description = 轧制钛板，凝固汽油弹的弹体材料。
item.ironworks-napalm-ammo.name = 凝固汽油弹
item.ironworks-napalm-ammo.description = 命中后点燃地面，并让目标持续燃烧。
