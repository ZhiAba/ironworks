item.ironworks-iron-concentrate.name = 铁精矿
item.ironworks-iron-concentrate.description = 从铁砂中磁选富集得到的铁矿粉，还不是纯铁。
item.ironworks-iron-ingot.name = 铁锭
item.ironworks-iron-ingot.description = 氢气还原得到的海绵铁。
item.ironworks-steel-plate.name = 钢板
item.ironworks-steel-plate.description = 经氧气转炉脱碳后的钢材。

liquid.ironworks-oxygen.name = 氧气
liquid.ironworks-oxygen.description = 电解水的副产物，用于转炉炼钢。

block.ironworks-separator.name = 磁选机
block.ironworks-separator.description = 用磁力对铁砂做物理分选，不消耗任何药剂。
block.ironworks-electrolysis-plant.name = 电解车间
block.ironworks-electrolysis-plant.description = 一套电解槽：通电分解水制氢氧，或换电解液做电解精炼。切换配方选择产物。氢气从右侧、氧气从左侧输出（箭头标记）。
block.ironworks-reducer.name = 氢还原炉
block.ironworks-reducer.description = Fe₂O₃ + 3H₂ → 2Fe + 3H₂O。用氢气把铁精矿还原成铁，副产水。
block.ironworks-converter.name = 转炉
block.ironworks-converter.description = 铁水顶吹氧气脱碳。铁水自带显热，碳氧反应还放热，不需要外部热源。铁水与氧气都要从相邻方块输入，钢水从相邻方块输出。
block.ironworks-steel-wall.name = 钢板墙
block.ironworks-steel-wall.description = 由轧制钢板构成的墙体，坚固且易于修复。

techtree.ironworks = 铁流工业
item.ironworks-steel-ingot.name = 钢锭
item.ironworks-steel-ingot.description = 转炉脱碳后的精炼产物，还需轧制才能成板。
block.ironworks-rolling-mill.name = 轧机
block.ironworks-rolling-mill.description = 压延成形：铜、铅、钛、钢，四种板材共用一套轧辊。切换配方选择金属。
item.ironworks-copper-plate.name = 铜板
item.ironworks-copper-plate.description = 铜轧制而成的板材，弹壳与零件的基础料。
item.ironworks-lead-plate.name = 铅板
item.ironworks-lead-plate.description = 铅轧制而成的板材，软而密。
item.ironworks-pure-copper.name = 高纯铜
item.ironworks-pure-copper.description = 电解精炼得到的铜，纯度 99.9%。
item.ironworks-pure-lead.name = 高纯铅
item.ironworks-pure-lead.description = 电解精炼得到的铅。
item.ironworks-sulfur.name = 硫
item.ironworks-sulfur.description = 石油加氢脱硫时回收的单质硫。
item.ironworks-black-powder.name = 黑火药
item.ironworks-black-powder.description = 木炭、硫与氮源混合而成，最经典的发射药。
item.ironworks-casing.name = 弹壳
item.ironworks-casing.description = 冲压成型的黄铜弹壳。
item.ironworks-copper-head.name = 铜弹头
item.ironworks-copper-head.description = 软铜弹头。
item.ironworks-lead-head.name = 铅弹头
item.ironworks-lead-head.description = 致密铅弹头。
item.ironworks-titanium-head.name = 钛弹头
item.ironworks-titanium-head.description = 硬质钛弹头。
item.ironworks-alloy-head.name = 合金弹头
item.ironworks-alloy-head.description = 巨浪合金弹头，硬度极高。
item.ironworks-water-barrel.name = 水桶
item.ironworks-water-barrel.description = 把水封装成桶，便于用传送带运输。
item.ironworks-oil-barrel.name = 石油桶
item.ironworks-oil-barrel.description = 把石油封装成桶，便于用传送带运输。
item.ironworks-copper-ammo.name = 铜制弹药
item.ironworks-copper-ammo.description = 基础弹药。
item.ironworks-heavy-ammo.name = 重头弹
item.ironworks-heavy-ammo.description = 重弹头，单发伤害高、射速慢。
item.ironworks-lead-core-ammo.name = 铅芯被甲弹
item.ironworks-lead-core-ammo.description = 铅芯外覆被甲，对装甲目标更有效。
item.ironworks-ti-pierce-ammo.name = 钛芯穿甲弹
item.ironworks-ti-pierce-ammo.description = 钛芯弹头，穿透力强。
item.ironworks-ti-overpressure-ammo.name = 钛超压穿甲弹
item.ironworks-ti-overpressure-ammo.description = 钛芯配超压装药，穿透力最强。
block.ironworks-copper-roller.name = 铜轧机
block.ironworks-copper-roller.description = 把铜轧制成铜板。
block.ironworks-lead-roller.name = 铅轧机
block.ironworks-lead-roller.description = 把铅轧制成铅板。
block.ironworks-copper-refinery.name = 铜电解槽
block.ironworks-copper-refinery.description = 电解精炼铜板，得到高纯铜。
block.ironworks-lead-refinery.name = 铅电解槽
block.ironworks-lead-refinery.description = 电解精炼铅板，得到高纯铅。
block.ironworks-desulfurizer.name = 脱硫塔
block.ironworks-desulfurizer.description = 加氢脱硫：石油与氢气反应，回收硫。
block.ironworks-powder-mixer.name = 火药混合机
block.ironworks-powder-mixer.description = 把木炭、硫与氮源混成黑火药。
block.ironworks-press.name = 冲压机
block.ironworks-press.description = 冲压成形：弹壳与各种材质的弹头都在这里出来。切换配方选择产物。
block.ironworks-ammo-assembler.name = 弹药组装机
block.ironworks-ammo-assembler.description = 把弹壳、弹头与火药组装成成品弹药。
