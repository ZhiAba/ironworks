item.ironworks-reactive-plate.name = 反应装甲块
item.ironworks-reactive-plate.description = 外挂装甲。以爆炸反应层抵消动能，防御力最高，但笨重。
item.ironworks-composite-plate.name = 复合装甲块
item.ironworks-composite-plate.description = 外挂装甲。陶瓷与金属夹层，防护与机动折中。
item.ironworks-nanite-plate.name = 纳米装甲块
item.ironworks-nanite-plate.description = 外挂装甲。附带纳米机群，能自我修复并小幅增强单位。
block.ironworks-armor-press.name = 装甲压制机
block.ironworks-armor-press.description = 把钢板与钛板压成外挂装甲块。三种装甲，三种取舍。
block.ironworks-armor-dock.name = 外挂装甲坞
block.ironworks-armor-dock.description = 给范围内的友军单位装上装甲块，一件一块，装上不会脱落。一个单位只能穿一件。
recipe.ironworks.reactive-plate = 反应装甲块
recipe.ironworks.composite-plate = 复合装甲块
recipe.ironworks.nanite-plate = 纳米装甲块

liquid.ironworks-molten-iron.name = 铁水
liquid.ironworks-molten-iron.description = 高炉出铁口放出的熔融生铁，约 1400℃。只能靠相邻方块直接输送。
liquid.ironworks-molten-steel.name = 钢水
liquid.ironworks-molten-steel.description = 转炉或电弧炉出钢后的熔钢，送去连铸。
block.ironworks-caster.name = 连铸机
block.ironworks-caster.description = 三用铸机：钢水铸钢锭、铁水铸生铁锭、铁水加沙模铸铸铁件。液体从相邻方块输入。
block.ironworks-arc-furnace.name = 电弧炉
block.ironworks-arc-furnace.description = 用三相电极把海绵铁重熔炼钢。这里才真正用电——大规模用电炼钢是工业时代的事。
recipe.ironworks.molten-iron = 铁水
recipe.ironworks.molten-steel = 钢水
recipe.ironworks.steel-ingot = 钢锭
recipe.ironworks.arc-steel = 电弧炉炼钢

block.ironworks-air-separator.name = 空气分离机
block.ironworks-air-separator.description = 深冷分离空气：氮气从右侧、氧气从左侧输出（箭头标记）。塞普罗原本没有氮气来源，黑火药的硝酸盐就靠它。

item.ironworks-cast-iron.name = 铸铁件
item.ironworks-cast-iron.description = 铁水浇进沙模得到的灰口铸铁毛坯，用来做重型机械的机架与底座。
recipe.ironworks.cast-iron = 铸铁件
recipe.ironworks.cast-iron-ingot = 生铁锭
recipe.ironworks.ladle-steel = 铁水精炼

recipe.ironworks.air-separation = 空气分离
recipe.ironworks.reduce-iron = 氢还原

item.ironworks-iron-plate.name = 铁板
item.ironworks-iron-plate.description = 铁锭轧制而成的基础工业部件，炮弹组装室与重型机械的骨架。
item.ironworks-he-shell.name = 高爆炮弹
item.ironworks-he-shell.description = 大口径榴弹。溅射范围大，适合清群。
item.ironworks-ap-shell.name = 穿甲炮弹
item.ironworks-ap-shell.description = 大口径穿甲弹。直击伤害高，可击穿多个目标。
item.ironworks-incendiary-shell.name = 燃烧炮弹
item.ironworks-incendiary-shell.description = 灌装稠化油的燃烧弹。命中后点燃地面并持续灼烧。
item.ironworks-frag-shell.name = 破片炮弹
item.ironworks-frag-shell.description = 空爆后炸出大量破片，覆盖大片区域。
block.ironworks-shell-assembly.name = 炮弹组装室
block.ironworks-shell-assembly.description = 生产迫击炮专用的四种大口径炮弹。四配方，切换弹种。
block.ironworks-mortar.name = 迫击炮
block.ironworks-mortar.description = 70 格射程的曲射重炮，自动瞄准射程内最密集的敌群，溅射半径极大；但 20 格内是盲区（选中时显示红圈）。只吃大口径炮弹，不能装通用子弹。
recipe.ironworks.iron-plate = 铁板
recipe.ironworks.he-shell = 高爆炮弹
recipe.ironworks.ap-shell = 穿甲炮弹
recipe.ironworks.incendiary-shell = 燃烧炮弹
recipe.ironworks.frag-shell = 破片炮弹

item.ironworks-graphene.name = 石墨烯
item.ironworks-graphene.description = 石墨加氢剥离出的单层碳。冷却液、高级电子与装甲的入口。
liquid.ironworks-graphene-coolant.name = 石墨烯冷却液
liquid.ironworks-graphene-coolant.description = 冷液。循环冷却的起点，设备吸热后变成热液。
liquid.ironworks-hot-coolant.name = 热冷却液
liquid.ironworks-hot-coolant.description = 热液。送去冷却工厂降温后变回冷液。
block.ironworks-graphene-forge.name = 石墨烯炉
block.ironworks-graphene-forge.description = 石墨在氢气气氛中剥离成石墨烯。耗电、耗氢。
block.ironworks-fluidizer.name = 石墨烯流化机
block.ironworks-fluidizer.description = 石墨烯 + 水 + 电 → 石墨烯冷却液（冷液）。
block.ironworks-coolant-plant.name = 冷却工厂
block.ironworks-coolant-plant.description = 热液 + 水 + 电 → 冷液，1:1 复原。循环的另一半。
recipe.ironworks.graphene = 石墨烯
recipe.ironworks.graphene-coolant = 石墨烯冷却液
recipe.ironworks.recool = 冷却

liquid.ironworks-acid.name = 酸
liquid.ironworks-acid.description = 基础化工液体。用于腐蚀弹与酸法石墨烯。
item.ironworks-silicon-carbide.name = 碳化硅
item.ironworks-silicon-carbide.description = 耐高温陶瓷。耐高温管道与石墨坩埚的内衬。
item.ironworks-graphite-electrode.name = 高纯石墨电极
item.ironworks-graphite-electrode.description = 电弧炉与高温管道的导电/耐热部件。
item.ironworks-molten-iron-barrel.name = 熔融铁水桶
item.ironworks-molten-iron-barrel.description = 装运铁水的耐高温桶。可直接在连铸机/转炉旁倒出。
item.ironworks-molten-steel-barrel.name = 熔融钢水桶
item.ironworks-molten-steel-barrel.description = 装运钢水的耐高温桶。
block.ironworks-acid-plant.name = 制酸车间
block.ironworks-acid-plant.description = 硫 + 水 + 电 → 酸。腐蚀弹与酸法石墨烯的源头。
block.ironworks-hot-conduit.name = 耐高温管道
block.ironworks-hot-conduit.description = 碳化硅内衬的石墨管道，专为熔融金属设计。普通管道能进，但会被烧穿。
block.ironworks-graphite-crucible.name = 石墨坩埚
block.ironworks-graphite-crucible.description = 熔融金属储罐。容量 1500，专为高温液体设计。
recipe.ironworks.acid = 制酸
recipe.ironworks.graphene-acid = 酸法石墨烯
recipe.ironworks.graphite-electrode = 石墨电极
recipe.ironworks.silicon-carbide = 碳化硅
recipe.ironworks.molten-iron-barrel = 熔融铁水桶
recipe.ironworks.molten-steel-barrel = 熔融钢水桶

block.ironworks-hot-router.name = 耐高温路由器
block.ironworks-hot-router.description = 熔融金属专用的液体路由器。
block.ironworks-hot-junction.name = 耐高温交叉器
block.ironworks-hot-junction.description = 两条熔融金属管线交叉而不混合。
block.ironworks-hot-bridge.name = 耐高温管道桥
block.ironworks-hot-bridge.description = 跨过障碍输送熔融金属。

block.ironworks-coolant-conduit.name = 冷却循环管道
block.ironworks-coolant-conduit.description = 闭环冷却专用管道。断头不泄漏——普通导管在断头处会把冷却液漏到地上，看起来就像液体凭空蒸发。

block.ironworks-liquid-conveyor.name = 通液传送带
block.ironworks-liquid-conveyor.description = 带面有一道液体槽，能顺路带走少量液体。容量 9、推进极慢、断头会漏——只能当"顺路补水"，不能替代管道。带上有液体时物品移动更快；被摧毁时带内液体会淬灭火焰。

block.ironworks-liquid-monitor.name = 液体计量器（调试）
block.ironworks-liquid-monitor.description = 每秒把全图冷/热冷却液的精确总量和每个方块的明细写进 /sdcard/ironworks-liquid.log。只用于排查液体丢失，不进科技树。

block.ironworks-liquid-belt-router.name = 通液路由器
block.ironworks-liquid-belt-router.description = 四向分配物品，同时把带内液体倒给邻居。用来做传送带网络的岔路。
block.ironworks-liquid-belt-bridge.name = 通液带桥
block.ironworks-liquid-belt-bridge.description = 跨越 4 格的物品桥，同时把液体沿链接送到对岸。
block.ironworks-liquid-conveyor-adv.name = 强化通液传送带
block.ironworks-liquid-conveyor-adv.description = 碳化硅 + 石墨电极制造。更快、液体容量 15、液体推进更快、带液加速 1.5×。
block.ironworks-liquid-belt-router-adv.name = 强化通液路由器
block.ironworks-liquid-belt-router-adv.description = 耐高温材料的通液路由器，容量 15、液体推进更快。
block.ironworks-liquid-belt-bridge-adv.name = 强化通液带桥
block.ironworks-liquid-belt-bridge-adv.description = 跨越 6 格，液体输送更快。

block.ironworks-liquid-belt-junction.name = 通液交叉器
block.ironworks-liquid-belt-junction.description = 物品与液体从一侧直穿到对侧，相交的两条线互不混合。
block.ironworks-liquid-belt-junction-adv.name = 强化通液交叉器
