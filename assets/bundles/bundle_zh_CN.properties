item.ironworks-corrosive-ammo.name = 腐蚀弹
item.ironworks-corrosive-ammo.description = 内装硫化物腐蚀剂。直接伤害平庸，但会持续溶解装甲，并拖慢目标。
block.ironworks-nano-field.name = 纳米修复场
block.ironworks-nano-field.description = 向范围内友军释放纳米机群，持续修补装甲并小幅提升作战性能。
block.ironworks-jade-beacon.name = 玉碎信标
block.ironworks-jade-beacon.description = 给范围内友军装上自毁协议：单位阵亡时爆裂，对周围敌人造成伤害。
block.ironworks-critical-device.name = 临界装置
block.ironworks-critical-device.description = 只对残血单位起作用。解除限制器，换取更高的输出与机动。
recipe.ironworks.corrosive-ammo = 腐蚀弹

status.ironworks-reactive-armor.name = 反应装甲
