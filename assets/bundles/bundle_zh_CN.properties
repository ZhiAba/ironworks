block.ironworks-rbmk-reactor.name = RBMK 反应堆
block.ironworks-rbmk-reactor.description = 5×5 石墨慢化、水冷、控制棒调功率的反应堆。烧钍发电，同时吐出热冷却液（送汽轮机或老的冷却工厂都能回收）。控制棒插得越深功率越低；冷却水不足时「空泡正反应性」会让通量不降反升。堆芯温度超过 125% 并持续 1 秒即熔毁：大范围爆炸 + 辐射。
